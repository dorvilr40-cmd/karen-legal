<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karen Analytics – Connected</title><style>body{margin:0;background:#fff;color:#1a1a1a;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:40px 16px 64px}
h1{font-size:1.8rem;line-height:1.25;margin:0 0 8px}h2{font-size:1.15rem;margin:32px 0 8px}
code{background:#f2f2f2;padding:1px 5px;border-radius:4px;font-size:.9em}a{color:#0b57d0}
nav{font-size:.9rem;margin-bottom:24px}nav a{margin-right:16px}
@media (prefers-color-scheme:dark){body{background:#121212;color:#e8e8e8}code{background:#2a2a2a}a{color:#8ab4f8}}</style><style>
.btn{display:inline-flex;align-items:center;gap:10px;background:#000;color:#fff;border:0;border-radius:8px;padding:12px 20px;font:600 16px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;cursor:pointer;text-decoration:none}
.btn:hover{background:#222}.card{border:1px solid #ddd;border-radius:12px;padding:20px;margin:24px 0}
.muted{color:#666;font-size:.9rem}.code{display:block;word-break:break-all;background:#f2f2f2;padding:12px;border-radius:8px;font:14px/1.4 ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){.btn{background:#fff;color:#000}.btn:hover{background:#ddd}.card{border-color:#333}.muted{color:#aaa}.code{background:#2a2a2a}}
</style></head>
<body><main><nav><a href="./">Karen Analytics</a><a href="terms.html">Terms of Service</a><a href="privacy.html">Privacy Policy</a></nav>
<h1 id="title">Connecting…</h1>
<div id="ok" hidden>
<p>Your TikTok account was authorized. Copy the authorization code below and paste it into Karen Analytics to load your stats.</p>
<span class="code" id="code"></span>
<p><button class="btn" id="copy">Copy code</button> <span class="muted" id="copied"></span></p>
<p class="muted">The code is valid for a few minutes and can only be used once.</p>
</div>
<div id="err" hidden><p id="errmsg"></p><p><a href="./">Back to Karen Analytics</a></p></div>
<script>
const q=new URLSearchParams(location.search);
const code=q.get("code"),state=q.get("state"),error=q.get("error");
let saved=null;try{saved=sessionStorage.getItem("tt_state");}catch(e){}
const title=document.getElementById("title");
if(error||!code){
  title.textContent="Authorization not completed";
  document.getElementById("errmsg").textContent=error?("TikTok returned: "+error+(q.get("error_description")?" – "+q.get("error_description"):"")):"No authorization code was received.";
  document.getElementById("err").hidden=false;
}else if(saved&&state!==saved){
  title.textContent="Security check failed";
  document.getElementById("errmsg").textContent="The request state does not match. Please start again from the home page.";
  document.getElementById("err").hidden=false;
}else{
  title.textContent="TikTok account connected";
  document.getElementById("code").textContent=code;
  document.getElementById("ok").hidden=false;
  document.getElementById("copy").addEventListener("click",async()=>{
    try{await navigator.clipboard.writeText(code);document.getElementById("copied").textContent="Copied";}
    catch(e){document.getElementById("copied").textContent="Select the code and copy it manually";}
  });
}
</script>
</main></body></html>
